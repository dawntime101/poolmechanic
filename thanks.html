<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Austin Pool Mechanic</title>
    <link rel="stylesheet" href="style.css"> 
    <style>
        .thanks-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 80vh;
            text-align: center;
            padding: 20px;
        }
        .thanks-icon {
            font-size: 4rem;
            color: #2ecc71; /* A nice green checkmark color */
            margin-bottom: 20px;
        }
        .btn-home {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 30px;
            background-color: #007bff; /* Use your site's primary color */
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .btn-home:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="thanks-container">
        <div class="thanks-icon">✔</div>
        <h1>Request Received!</h1>
        <p>Thank you for reaching out to Austin Pool Mechanic.</p>
        <p>We've received your service request and will get back to you <strong>within 24 hours</strong> to discuss your pool or spa needs.</p>
        
        <a href="index.html" class="btn-home">Back to Home</a>
    </div>

</body>
</html>
